[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-detective"
version = "0.1.0"
description = "Finds and tests long-term trends in NASA Earth science variables"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["live: calls the real NASA POWER API (deselected by default)"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["trend_detective", "api"]

[tool.setuptools.packages.find]
include = ["trend_detective*", "api*"]

# The GISTEMP grid and the NOAA station file are read from inside the package at run time.
[tool.setuptools.package-data]
trend_detective = ["data/*.npz", "data/*.json"]
